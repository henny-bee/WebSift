[project]
name = "universal-web-scraper-api"
version = "2.3.0"
description = "Deterministic, low-RAM universal web scraper API (FastAPI + curl_cffi/httpx + selectolax + SQLite)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
    "curl_cffi>=0.7.0",
]

[project.optional-dependencies]
extras = [
    "trafilatura>=1.8.0",
    "pyyaml>=6.0.1",
    "patchright>=1.45.0",
]
dev = [
    "pytest>=8.0.0",
    "anyio>=4.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
