<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tech Catalog</title>
  <meta property="og:image" content="https://shop.example.com/assets/store-og.webp">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Laptop Alpha 14",
    "description": "14-inch portable developer laptop",
    "url": "https://shop.example.com/product/alpha-14",
    "sku": "ALP-14",
    "brand": {"@type": "Brand", "name": "ExampleTech"},
    "image": ["https://cdn.example.com/products/alpha-14.webp"],
    "offers": {
      "@type": "Offer",
      "price": "799.00",
      "priceCurrency": "EUR",
      "availability": "https://schema.org/InStock"
    }
  }
  </script>
</head>
<body>
  <main>
    <h1>Developer Hardware</h1>
    <div class="product-grid">
      <div class="product-card">
        <img src="https://cdn.example.com/products/alpha-14.webp" alt="Laptop Alpha 14">
        <h3><a href="/product/alpha-14">Laptop Alpha 14</a></h3>
        <p class="description">14-inch portable developer laptop</p>
        <span class="price">€799.00</span>
      </div>
      <div class="product-card">
        <h3><a href="/product/dock-usb4">USB4 Pro Dock (No Photo Yet)</a></h3>
        <p class="description">Dual 4K display dock with 100W PD.</p>
        <span class="price">€129.00</span>
      </div>
    </div>
  </main>
</body>
</html>
